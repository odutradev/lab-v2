services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:80"
    environment:
      - PORT=80
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MONGO_URI=${MONGO_URI:-${MONGOURI}}
      - MONGOURI=${MONGOURI:-${MONGO_URI}}
      - MONGOURI_TEST=${MONGOURI_TEST}
      - JWT_SECRET=${JWT_SECRET:-${JWT}}
      - PRODUCTION=${PRODUCTION:-true}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-465}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS:-${EMAIL_PASSWORD}}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-${EMAIL_PASS}}
      - EMAIL_FROM=${EMAIL_FROM:-${EMAIL_USER}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - lab-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
